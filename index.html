<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Play & Build</title>
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Play & Build">

<style>
* {
box-sizing: border-box;
margin: 0;
padding: 0;
-webkit-tap-highlight-color: transparent;
-webkit-user-select: none;
user-select: none;
}

html, body {
height: 100%;
overflow: hidden;
font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
background: #FFF8E7;
}

.app {
display: flex;
flex-direction: column;
height: 100vh;
width: 100vw;
}

.header {
background: #FF6B9D;
color: white;
padding: 16px;
text-align: center;
font-size: 28px;
font-weight: bold;
letter-spacing: 1px;
box-shadow: 0 2px 6px rgba(0,0,0,0.1);
flex-shrink: 0;
}

.stage {
flex: 1;
background: #B8E0F6;
position: relative;
display: flex;
align-items: flex-end;
justify-content: center;
overflow: hidden;
padding-bottom: 20px;
}

.lily {
max-height: 90%;
max-width: 60%;
height: auto;
width: auto;
object-fit: contain;
}

/* ===== MODE TOGGLE (Row 1) ===== */
.mode-toggle {
background: #FFF8E7;
padding: 10px 12px;
display: flex;
gap: 8px;
border-top: 4px solid #333;
flex-shrink: 0;
}

.mode-btn {
flex: 1;
padding: 12px;
text-align: center;
font-size: 16px;
font-weight: bold;
color: #333;
background: white;
border: 3px solid #333;
border-radius: 18px;
cursor: pointer;
}

.mode-btn.active.lily-mode {
background: #FF6B9D;
color: white;
}

.mode-btn.active.world-mode {
background: #4A9D5B;
color: white;
}

/* ===== CATEGORIES ROW (Row 2) ===== */
.categories {
background: white;
border-top: 3px solid #333;
overflow-x: auto;
overflow-y: hidden;
flex-shrink: 0;
-webkit-overflow-scrolling: touch;
}

.categories::-webkit-scrollbar {
display: none;
}

.categories-inner {
display: flex;
gap: 8px;
padding: 12px;
min-width: max-content;
}

.category {
padding: 10px 16px;
background: white;
color: #333;
border: 3px solid #333;
border-radius: 18px;
font-size: 14px;
font-weight: bold;
white-space: nowrap;
cursor: pointer;
}

.category.active.lily-mode {
background: #FF6B9D;
color: white;
}

.category.active.world-mode {
background: #4A9D5B;
color: white;
}

/* ===== OPTIONS ROW (Row 3) ===== */
.options {
background: #FFE5B4;
padding: 16px;
min-height: 90px;
display: flex;
gap: 12px;
justify-content: center;
align-items: center;
flex-shrink: 0;
border-top: 3px solid #333;
}

.options-placeholder {
color: #888;
font-size: 14px;
font-style: italic;
text-align: center;
padding: 8px;
}
</style>
</head>

<body>
<div class="app">

<div class="header">🎨 Play &amp; Build</div>

<div class="stage">
<img src="lily.png" alt="Lily" class="lily">
</div>

<!-- Row 1: Mode Toggle -->
<div class="mode-toggle">
<div class="mode-btn active lily-mode" data-mode="lily">👧 Lily</div>
<div class="mode-btn" data-mode="world">🌳 World</div>
</div>

<!-- Row 2: Scrolling Categories -->
<div class="categories">
<div class="categories-inner" id="categoriesInner">
<!-- categories get filled by JavaScript -->
</div>
</div>

<!-- Row 3: Options -->
<div class="options">
<span class="options-placeholder" id="optionsPlaceholder">Tap a category to see options</span>
</div>

</div>

<script>
// ===== The two sets of categories =====
const categories = {
lily: [
{ id: 'hairColor', label: '🎨 Hair Color' },
{ id: 'hairStyle', label: '💇 Hair Style' },
{ id: 'eyes', label: '👀 Eyes' },
{ id: 'top', label: '👕 Top' },
{ id: 'bottom', label: '👖 Bottom' },
{ id: 'accessories',label: '⌚ Accessories' },
{ id: 'pet', label: '🐾 Pet' }
],
world: [
{ id: 'trees', label: '🌳 Trees' },
{ id: 'flowers', label: '🌷 Flowers' },
{ id: 'sky', label: '☀️ Sky' },
{ id: 'water', label: '💧 Water' },
{ id: 'furniture', label: '🪑 Furniture' },
{ id: 'background', label: '🏔️ Background' }
]
};

let currentMode = 'lily';
let activeCategoryId = null;

const modeButtons = document.querySelectorAll('.mode-btn');
const categoriesInner = document.getElementById('categoriesInner');
const optionsPlaceholder = document.getElementById('optionsPlaceholder');

function renderCategories() {
categoriesInner.innerHTML = '';
const list = categories[currentMode];

list.forEach(function(cat) {
const btn = document.createElement('div');
btn.className = 'category';
if (cat.id === activeCategoryId) {
btn.classList.add('active');
btn.classList.add(currentMode + '-mode');
}
btn.textContent = cat.label;
btn.addEventListener('click', function() {
activeCategoryId = cat.id;
renderCategories();
optionsPlaceholder.textContent = 'Options for "' + cat.label + '" coming soon!';
});
categoriesInner.appendChild(btn);
});
}

modeButtons.forEach(function(btn) {
btn.addEventListener('click', function() {
currentMode = btn.dataset.mode;
activeCategoryId = null;

modeButtons.forEach(function(b) {
b.classList.remove('active');
b.classList.remove('lily-mode');
b.classList.remove('world-mode');
});
btn.classList.add('active');
btn.classList.add(currentMode + '-mode');

renderCategories();
optionsPlaceholder.textContent = 'Tap a category to see options';
});
});

renderCategories();
</script>

</body>
</html>
