<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Play & Build</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Play & Build">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      -webkit-user-select: none;
      user-select: none;
    }

    html, body {
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
      background: #FFF8E7;
    }

    .app {
      display: flex;
      flex-direction: column;
      height: 100vh;
      width: 100vw;
    }

    .header {
      background: #FF6B9D;
      color: white;
      padding: 16px;
      text-align: center;
      font-size: 28px;
      font-weight: bold;
      letter-spacing: 1px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      flex-shrink: 0;
    }

    .stage {
      flex: 1;
      background: #B8E0F6;
      position: relative;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      overflow: hidden;
      padding-bottom: 20px;
    }

    .lily {
      max-height: 90%;
      max-width: 60%;
      height: auto;
      width: auto;
      object-fit: contain;
    }

    .lily-overlay {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      max-height: 90%;
      max-width: 60%;
      height: auto;
      width: auto;
      object-fit: contain;
      pointer-events: none;
    }

    .lily-overlay.hidden {
      display: none;
    }

    /* ===== MODE TOGGLE (Row 1) ===== */
    .mode-toggle {
      background: #FFF8E7;
      padding: 10px 12px;
      display: flex;
      gap: 8px;
      border-top: 4px solid #333;
      flex-shrink: 0;
    }

    .mode-btn {
      flex: 1;
      padding: 12px;
      text-align: center;
      font-size: 16px;
      font-weight: bold;
      color: #333;
      background: white;
      border: 3px solid #333;
      border-radius: 18px;
      cursor: pointer;
    }

    .mode-btn.active.lily-mode {
      background: #FF6B9D;
      color: white;
    }

    .mode-btn.active.world-mode {
      background: #4A9D5B;
      color: white;
    }

    /* ===== CATEGORIES ROW (Row 2) ===== */
    .categories {
      background: white;
      border-top: 3px solid #333;
      overflow-x: auto;
      overflow-y: hidden;
      flex-shrink: 0;
      -webkit-overflow-scrolling: touch;
    }

    .categories::-webkit-scrollbar {
      display: none;
    }

    .categories-inner {
      display: flex;
      gap: 8px;
      padding: 12px;
      min-width: max-content;
    }

    .category {
      padding: 10px 16px;
      background: white;
      color: #333;
      border: 3px solid #333;
      border-radius: 18px;
      font-size: 14px;
      font-weight: bold;
      white-space: nowrap;
      cursor: pointer;
    }

    .category.active.lily-mode {
      background: #FF6B9D;
      color: white;
    }

    .category.active.world-mode {
      background: #4A9D5B;
      color: white;
    }

    /* ===== OPTIONS ROW (Row 3) ===== */
    .options {
      background: #FFE5B4;
      padding: 16px;
      min-height: 90px;
      display: flex;
      gap: 10px;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      flex-shrink: 0;
      border-top: 3px solid #333;
      overflow-x: auto;
    }

    .options-placeholder {
      color: #888;
      font-size: 14px;
      font-style: italic;
      text-align: center;
      padding: 8px;
    }

    /* Style for a clickable option button */
    .option {
      padding: 10px 16px;
      background: white;
      color: #333;
      border: 3px solid #333;
      border-radius: 14px;
      font-size: 14px;
      font-weight: bold;
      white-space: nowrap;
      cursor: pointer;
      min-width: 70px;
      text-align: center;
    }

    .option.selected {
      background: #FF6B9D;
      color: white;
    }
  </style>
</head>

<body>
  <div class="app">

    <div class="header">🎨 Play &amp; Build</div>

    <div class="stage">
      <img src="lily_long_brown.png" alt="Lily" class="lily" id="lilyImg">
      <img src="" alt="" class="lily-overlay hidden" id="topOverlay">
    </div>

    <!-- Row 1: Mode Toggle -->
    <div class="mode-toggle">
      <div class="mode-btn active lily-mode" data-mode="lily">👧 Lily</div>
      <div class="mode-btn" data-mode="world">🌳 World</div>
    </div>

    <!-- Row 2: Scrolling Categories -->
    <div class="categories">
      <div class="categories-inner" id="categoriesInner">
        <!-- categories get filled by JavaScript -->
      </div>
    </div>

    <!-- Row 3: Options -->
    <div class="options" id="optionsRow">
      <span class="options-placeholder" id="optionsPlaceholder">Tap a category to see options</span>
    </div>

  </div>

  <script>
    // ===== Categories =====
    const categories = {
      lily: [
        { id: 'hairColor',  label: '🎨 Hair Color' },
        { id: 'hairStyle',  label: '💇 Hair Style' },
        { id: 'eyes',       label: '👀 Eyes' },
        { id: 'top',        label: '👕 Top' },
        { id: 'bottom',     label: '👖 Bottom' },
        { id: 'accessories',label: '⌚ Accessories' },
        { id: 'pet',        label: '🐾 Pet' }
      ],
      world: [
        { id: 'trees',      label: '🌳 Trees' },
        { id: 'flowers',    label: '🌷 Flowers' },
        { id: 'sky',        label: '☀️ Sky' },
        { id: 'water',      label: '💧 Water' },
        { id: 'furniture',  label: '🪑 Furniture' },
        { id: 'background', label: '🏔️ Background' }
      ]
    };

    // ===== Hair Style options =====
    // Each option has a label and a filename for the Lily image to display.
    const hairStyles = [
      { id: 'long',     label: 'Long',     file: 'lily_long_brown.png' },
      { id: 'bob',      label: 'Bob',      file: 'lily_bob_brown.png' },
      { id: 'ponytail', label: 'Ponytail', file: 'lily_ponytail_brown.png' }
    ];

    // ===== Top options =====
    // file: null means no overlay (hide it).
    const tops = [
      { id: 'none',   label: 'None',        file: null },
      { id: 'hoodie', label: 'Pink Hoodie', file: 'top_hoodie_pink.png' }
    ];

    let currentMode = 'lily';
    let activeCategoryId = null;
    let currentHairStyle = 'long'; // matches the default <img src="lily_long_brown.png">
    let currentTop = 'none';

    const modeButtons = document.querySelectorAll('.mode-btn');
    const categoriesInner = document.getElementById('categoriesInner');
    const optionsRow = document.getElementById('optionsRow');
    const lilyImg = document.getElementById('lilyImg');
    const topOverlay = document.getElementById('topOverlay');

    // Render the categories row
    function renderCategories() {
      categoriesInner.innerHTML = '';
      const list = categories[currentMode];

      list.forEach(function(cat) {
        const btn = document.createElement('div');
        btn.className = 'category';
        if (cat.id === activeCategoryId) {
          btn.classList.add('active');
          btn.classList.add(currentMode + '-mode');
        }
        btn.textContent = cat.label;
        btn.addEventListener('click', function() {
          activeCategoryId = cat.id;
          renderCategories();
          renderOptions();
        });
        categoriesInner.appendChild(btn);
      });
    }

    // Render the options row based on what category is active
    function renderOptions() {
      optionsRow.innerHTML = '';

      if (activeCategoryId === 'hairStyle' && currentMode === 'lily') {
        hairStyles.forEach(function(style) {
          const btn = document.createElement('div');
          btn.className = 'option';
          if (style.id === currentHairStyle) {
            btn.classList.add('selected');
          }
          btn.textContent = style.label;
          btn.addEventListener('click', function() {
            currentHairStyle = style.id;
            lilyImg.src = style.file;
            renderOptions();
          });
          optionsRow.appendChild(btn);
        });
        return;
      }

      if (activeCategoryId === 'top' && currentMode === 'lily') {
        tops.forEach(function(top) {
          const btn = document.createElement('div');
          btn.className = 'option';
          if (top.id === currentTop) {
            btn.classList.add('selected');
          }
          btn.textContent = top.label;
          btn.addEventListener('click', function() {
            currentTop = top.id;
            if (top.file) {
              topOverlay.src = top.file;
              topOverlay.classList.remove('hidden');
            } else {
              topOverlay.classList.add('hidden');
              topOverlay.removeAttribute('src');
            }
            renderOptions();
          });
          optionsRow.appendChild(btn);
        });
        return;
      }

      // For other categories, show "coming soon"
      if (activeCategoryId) {
        const placeholder = document.createElement('span');
        placeholder.className = 'options-placeholder';
        const list = categories[currentMode];
        const cat = list.find(function(c) { return c.id === activeCategoryId; });
        placeholder.textContent = 'Options for "' + cat.label + '" coming soon!';
        optionsRow.appendChild(placeholder);
        return;
      }

      // Default placeholder
      const placeholder = document.createElement('span');
      placeholder.className = 'options-placeholder';
      placeholder.textContent = 'Tap a category to see options';
      optionsRow.appendChild(placeholder);
    }

    // Mode toggle
    modeButtons.forEach(function(btn) {
      btn.addEventListener('click', function() {
        currentMode = btn.dataset.mode;
        activeCategoryId = null;

        modeButtons.forEach(function(b) {
          b.classList.remove('active');
          b.classList.remove('lily-mode');
          b.classList.remove('world-mode');
        });
        btn.classList.add('active');
        btn.classList.add(currentMode + '-mode');

        renderCategories();
        renderOptions();
      });
    });

    renderCategories();
    renderOptions();
  </script>

</body>
</html>
